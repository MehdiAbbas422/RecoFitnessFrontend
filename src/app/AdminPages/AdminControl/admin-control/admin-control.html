<div class="admin-container">
  <div class="toolbar">
    <h2>Access Control Log</h2>
    <div class="search-group">
      <input type="text" [(ngModel)]="search" placeholder="Search members..." style="background:#111; border:1px solid #333; padding:10px; color:#fff;" />
      <button class="btn-activate" (click)="DeactivateUser()" style="margin-left:10px;">Filter</button>
    </div>
  </div>

  <table class="premium-table">
    <thead>
      <tr>
        <th>Member</th>
        <th>Email</th>
        <th>Reason</th>
        <th>Status</th>
        <th>Control</th>
      </tr>
    </thead>
    <tbody>
      @for (user of Users; track user.id) {
        <tr>
          <td>
            <div style="font-weight:700; font-size:1.1rem; color:#fff;">{{ user.userName }}</div>
            <div style="font-size:0.7rem; color:#666;">ID: {{ user.userId }}</div>
          </td>
          <td>{{ user.email }}</td>
          <td><span style="color:#ef4444;">{{ user.deactivationReason }}</span></td>
          <td>
            <div style="font-size:0.8rem;">REMAINING:</div>
            <div style="color:#fff; font-weight:700;">{{ user.remainingDays }} DAYS</div>
          </td>
          <td>
            <button class="btn-activate" (click)="Activate(user.userId)">Reactivate</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
