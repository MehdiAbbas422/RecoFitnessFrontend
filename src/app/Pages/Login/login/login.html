<div class="auth-wrapper">
  <div class="auth-container">
    <div class="brand-logo">RECOFIT</div>
    <h2>PLEASE LOG IN</h2>
    <p class="sub-text">Welcome back! Access your fitness account.</p>

    <form (ngSubmit)="Login()" #loginForm="ngForm" ngNativeValidate> 
      <div class="input-group">
        <label>Email Address</label>
        <input 
          type="email" 
          name="email" 
          placeholder="Enter your email"
          [disabled]="Isloading()" 
          [(ngModel)]="LoginInfo.Email" 
          required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input 
          type="password" 
          name="password" 
          placeholder="Enter your password"
          [disabled]="Isloading()" 
          [(ngModel)]="LoginInfo.Password" 
          required>
      </div>

      <button 
        type="submit" 
        class="btn-gradient" 
        [disabled]="Isloading()">
        {{ Isloading() ? '...Loading' : 'Login' }}
      </button>
    </form>

    <div class="auth-links">
      <p>Don't have an account? <a routerLink="/signup">Sign Up</a></p>
      <p style="margin-top: 8px;">Forgot Password? <a routerLink="/resetpassword">Reset Here</a></p>
    </div>
  </div>
</div>
