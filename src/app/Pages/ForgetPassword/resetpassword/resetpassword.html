<div class="gym-wrapper">
  <div class="gym-card">
    
    <!-- Top Status Indicator -->
    <div class="status-bar">
      <span class="status-dot"></span>
      <span class="status-text">{{ !emailconfirm() ? 'PHASE 01 // IDENTITY ACCESS' : 'PHASE 02 // SECURITY VERIFICATION' }}</span>
    </div>

    <!-- Main Gym Title -->
    <div class="card-header">
      <h1 class="gym-title">RESET <span class="highlight">PASSWORD</span></h1>
      <p class="sub-text">
        {{ !emailconfirm() ? 'ENTER YOUR REGISTERED ATHLETE EMAIL TO PROCEED' : 'ENTER THE 6-DIGIT OTP CODE SENT TO YOUR EMAIL' }}
      </p>
    </div>

    <!-- Step 1: Send OTP -->
    @if (!emailconfirm()) {
      <form class="gym-form" (submit)="$event.preventDefault()">
        <div class="input-block">
          <label for="email">ATHLETE EMAIL ADDRESS</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              [(ngModel)]="email" 
              placeholder="e.g. athlete@gymfit.com" 
              required 
            />
          </div>
        </div>

        <button 
          type="button" 
          class="gym-btn" 
          (click)="forgetPassword()" 
          [disabled]="Isloading()">
          <span class="btn-content">
            @if (Isloading()) {
              <span class="spinner"></span>
              <span>PROCESSING...</span>
            } @else {
              <span>SEND OTP CODE</span>
              <span class="btn-arrow">➔</span>
            }
          </span>
        </button>
      </form>
    } 
    <!-- Step 2: Reset Password -->
    @else {
      <form class="gym-form" (submit)="$event.preventDefault()">
        <div class="input-block">
          <label for="otp">ENTER OTP CODE</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="otp" 
              name="otp" 
              [(ngModel)]="otp" 
              placeholder="ENTER 6-DIGIT OTP" 
              required 
            />
          </div>
        </div>

        <button 
          type="button" 
          class="gym-btn" 
          (click)="resetPassword()" 
          [disabled]="Isloading()">
          <span class="btn-content">
            @if (Isloading()) {
              <span class="spinner"></span>
              <span>VERIFYING...</span>
            } @else {
              <span>CONFIRM RESET</span>
              <span class="btn-arrow">➔</span>
            }
          </span>
        </button>
      </form>
    }

  </div>
</div>
